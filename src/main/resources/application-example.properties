spring.application.name=yearly-goal-tracker

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/yearly_goal_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=YOUR_DB_PASSWORD

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=YOUR_JWT_SECRET_KEY_256BIT
jwt.expiration=86400000

# Google Gemini AI API Key (https://ai.google.dev)
google.ai.api-key=YOUR_GEMINI_API_KEY
