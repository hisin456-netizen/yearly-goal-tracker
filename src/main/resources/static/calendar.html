<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캘린더 — Yearly Goal Tracker</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/calendar.css">
</head>
<body>
  <div class="cal-app">

    <header class="cal-header">
      <button class="btn btn-secondary btn-sm" id="back-btn">← 대시보드</button>
      <div class="cal-month-nav">
        <button class="btn-icon btn-secondary" id="prev-month-btn" aria-label="이전 달">‹</button>
        <h2 id="month-label">2026년 1월</h2>
        <button class="btn-icon btn-secondary" id="next-month-btn" aria-label="다음 달">›</button>
      </div>
      <button class="btn btn-secondary btn-sm" id="open-settings-btn">🔔 알림 설정</button>
    </header>

    <div class="cal-layout">

      <!-- 월 그리드 -->
      <section class="cal-grid-panel glass-card">
        <div class="cal-weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </section>

      <!-- 선택한 날짜: 목록 + 등록 폼 -->
      <aside class="cal-day-panel glass-card">
        <h3 id="selected-date-label">오늘</h3>

        <div id="day-schedule-list" class="cal-day-list"></div>

        <div class="cal-add-form">
          <div class="form-group">
            <label>제목</label>
            <input type="text" id="sch-title" class="cal-input" placeholder="예: 헬스장, 스터디 모임">
          </div>
          <div class="cal-form-row">
            <div class="form-group">
              <label>시간</label>
              <input type="time" id="sch-time" class="cal-input">
            </div>
            <div class="form-group">
              <label>리마인드(분 전)</label>
              <input type="number" id="sch-reminder" class="cal-input" min="0" placeholder="기본값">
            </div>
          </div>
          <div class="form-group">
            <label>메모</label>
            <textarea id="sch-memo" class="cal-input cal-textarea" placeholder="선택 입력"></textarea>
          </div>
          <button type="button" class="btn btn-primary" id="sch-submit-btn" style="width:100%;">일정 추가</button>
        </div>
      </aside>

    </div>
  </div>

  <!-- 알림 설정 모달 -->
  <div class="cal-modal-overlay" id="settings-modal-overlay">
    <div class="cal-modal glass-card">
      <h3>🔔 Discord 알림 설정</h3>
      <p class="cal-modal-hint">디스코드 채널의 Incoming Webhook URL을 등록하면, 일정 시작 전에 알림을 받을 수 있어요.</p>
      <div class="form-group">
        <label>Discord Webhook URL</label>
        <input type="text" id="settings-webhook-url" class="cal-input" placeholder="https://discord.com/api/webhooks/...">
      </div>
      <div class="form-group">
        <label>기본 리마인드 시간 (분 전)</label>
        <input type="number" id="settings-default-reminder" class="cal-input" min="0">
      </div>
      <div class="cal-modal-actions">
        <button type="button" class="btn btn-secondary" id="settings-cancel-btn">취소</button>
        <button type="button" class="btn btn-primary" id="settings-save-btn">저장</button>
      </div>

      <div class="cal-login-history-section">
        <h4>🔐 최근 로그인 기록</h4>
        <div id="login-history-list" class="cal-login-history-list"></div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/js/calendar.js"></script>
</body>
</html>
