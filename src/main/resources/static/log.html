<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업 기록 — Yearly Goal Tracker</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/log.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ygt_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="log-app">

    <header class="log-header">
      <button class="btn btn-secondary btn-sm" id="back-btn">← 대시보드</button>
      <div class="log-breadcrumb">
        <span id="goal-title-label" class="log-breadcrumb-goal"></span>
        <span class="log-breadcrumb-sep">›</span>
        <span id="st-title-label" class="log-breadcrumb-st"></span>
      </div>
      <button type="button" id="theme-toggle-btn" class="btn btn-secondary btn-icon" style="margin-left: auto;" aria-label="테마 전환"></button>
    </header>

    <div class="log-layout">

      <!-- 왼쪽: 기록 추가 폼 -->
      <aside class="log-form-panel glass-card">
        <h3>기록 추가</h3>

        <div class="log-image-drop" id="image-drop-area">
          <input type="file" id="image-input" accept="image/*" style="display:none;">
          <img id="image-preview" alt="미리보기" style="display:none;">
          <div id="image-placeholder">
            <span>🖼️</span>
            <p>클릭하거나 이미지를 드롭</p>
            <p class="image-hint">문제 캡처, 노트 사진 등</p>
          </div>
          <button type="button" id="image-remove-btn" style="display:none;">✕ 제거</button>
        </div>

        <div class="form-group" style="margin-top: 16px;">
          <label>풀이 내용</label>
          <textarea id="log-content" class="form-control log-textarea" placeholder="풀이 과정, 메모, 오답 원인 등..."></textarea>
        </div>

        <div class="form-group">
          <label>결과</label>
          <div class="correct-btn-group">
            <button type="button" class="correct-btn" data-val="true">✅ 정답</button>
            <button type="button" class="correct-btn" data-val="false">❌ 오답</button>
            <button type="button" class="correct-btn active" data-val="">— 해당없음</button>
          </div>
        </div>

        <div class="form-group">
          <label>날짜</label>
          <input type="date" id="log-date" class="form-control">
        </div>

        <button type="button" class="btn btn-primary" id="submit-btn" style="width:100%;">기록 저장</button>
      </aside>

      <!-- 오른쪽: 기록 목록 -->
      <main class="log-list-panel">
        <div class="log-list-header">
          <h3>작업 기록 <span id="log-count"></span></h3>
        </div>
        <div id="log-list">
          <div style="text-align:center; padding:40px 20px; color:var(--text-muted);">불러오는 중...</div>
        </div>
      </main>

    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/js/log.js"></script>
</body>
</html>
