<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — Yearly Goal Tracker</title>
  <meta name="description" content="연간 목표를 세우고 매일 체크인하며 당신의 성장을 기록하세요.">
  <meta name="theme-color" content="#09090f">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-layout">

    <!-- Left: Brand Panel (데스크톱만 표시) -->
    <div class="brand-panel">
      <div class="brand-panel-inner">

        <div class="brand-logo-group">
          <div class="brand-icon">🎯</div>
          <span class="brand-name">Yearly Goal Tracker</span>
        </div>

        <div class="brand-hero">
          <h1>올해의 목표,<br>흐지부지 끝내지 마세요.</h1>
          <p>연간 목표를 세우고 매일 체크인하며<br>당신의 성장을 직접 눈으로 확인하세요.</p>
        </div>

        <ul class="feature-list">
          <li>
            <div class="feature-icon fi-emerald">📅</div>
            <div class="feature-text">
              <strong>연간 타임라인</strong>
              <span>12개월 간트 차트로 목표 일정을 한눈에</span>
            </div>
          </li>
          <li>
            <div class="feature-icon fi-indigo">✅</div>
            <div class="feature-text">
              <strong>일일 체크인</strong>
              <span>매일 실천을 기록하고 스트릭을 쌓으세요</span>
            </div>
          </li>
          <li>
            <div class="feature-icon fi-cyan">🌱</div>
            <div class="feature-text">
              <strong>실천 잔디</strong>
              <span>깃허브 스타일 히트맵으로 활동을 시각화</span>
            </div>
          </li>
        </ul>

        <div class="brand-stat-row">
          <div class="brand-stat">
            <span class="stat-num">12</span>
            <span class="stat-label">개월 트래킹</span>
          </div>
          <div class="brand-stat-div"></div>
          <div class="brand-stat">
            <span class="stat-num">365</span>
            <span class="stat-label">일 체크인</span>
          </div>
          <div class="brand-stat-div"></div>
          <div class="brand-stat">
            <span class="stat-num">∞</span>
            <span class="stat-label">가능성</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Right: Auth Form -->
    <div class="form-panel">
      <div class="form-panel-inner">

        <!-- 모바일 전용 브랜드 -->
        <div class="mobile-brand">
          <div class="brand-icon-sm">🎯</div>
          <span>Yearly Goal Tracker</span>
        </div>

        <div class="form-heading" id="form-heading">
          <h2>다시 돌아오셨군요!</h2>
          <p>오늘도 목표를 향해 한 걸음 더.</p>
        </div>

        <!-- 탭 -->
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab active" id="tab-login" role="tab" type="button" aria-selected="true">로그인</button>
          <button class="auth-tab" id="tab-signup" role="tab" type="button" aria-selected="false">회원가입</button>
        </div>

        <!-- 폼 -->
        <form id="auth-form" novalidate>

          <div class="form-group" id="group-username" style="display: none;">
            <label for="input-username">이름 / 닉네임</label>
            <input type="text" id="input-username" class="form-control" placeholder="예: 홍길동" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="input-email">이메일</label>
            <input type="email" id="input-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="input-password">비밀번호</label>
            <div class="input-with-icon">
              <input type="password" id="input-password" class="form-control" placeholder="6자 이상 비밀번호" required autocomplete="current-password">
              <button type="button" class="pw-toggle" id="pw-toggle" aria-label="비밀번호 표시 전환">
                <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="error-box" id="auth-error" role="alert" style="display: none;"></div>

          <button type="submit" class="btn-submit" id="btn-submit">
            <span id="btn-label">로그인하기</span>
          </button>
        </form>

        <p class="switch-text">
          <span id="switch-lead">계정이 없으신가요?</span>
          <button type="button" id="btn-switch">회원가입</button>
        </p>

      </div>
    </div>

  </div>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
