<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>칸반보드 — Yearly Goal Tracker</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/kanban.css">
</head>
<body>
  <div class="kb-app">

    <header class="kb-header">
      <button class="btn btn-secondary btn-sm" id="back-btn">← 대시보드</button>
      <h2 id="goal-title-label">칸반보드</h2>
      <button class="btn btn-primary btn-sm" id="open-add-btn">+ 새 하위작업</button>
    </header>

    <div class="kb-board" id="kb-board">
      <section class="kb-column" data-status="TODO">
        <div class="kb-column-header">
          <span class="kb-column-dot dot-todo"></span>
          <h3>할일</h3>
          <span class="kb-column-count" id="count-TODO">0</span>
        </div>
        <div class="kb-card-list" id="list-TODO"></div>
      </section>

      <section class="kb-column" data-status="IN_PROGRESS">
        <div class="kb-column-header">
          <span class="kb-column-dot dot-in-progress"></span>
          <h3>진행중</h3>
          <span class="kb-column-count" id="count-IN_PROGRESS">0</span>
        </div>
        <div class="kb-card-list" id="list-IN_PROGRESS"></div>
      </section>

      <section class="kb-column" data-status="COMPLETED">
        <div class="kb-column-header">
          <span class="kb-column-dot dot-completed"></span>
          <h3>완료</h3>
          <span class="kb-column-count" id="count-COMPLETED">0</span>
        </div>
        <div class="kb-card-list" id="list-COMPLETED"></div>
      </section>

      <section class="kb-column" data-status="DROPPED">
        <div class="kb-column-header">
          <span class="kb-column-dot dot-dropped"></span>
          <h3>중단</h3>
          <span class="kb-column-count" id="count-DROPPED">0</span>
        </div>
        <div class="kb-card-list" id="list-DROPPED"></div>
      </section>
    </div>
  </div>

  <!-- 새 하위작업 모달 -->
  <div class="kb-modal-overlay" id="add-modal-overlay">
    <div class="kb-modal glass-card">
      <h3>새 하위작업</h3>
      <div class="form-group">
        <label>제목</label>
        <input type="text" id="new-title" class="kb-input" placeholder="예: 매일 30분 문제풀이">
      </div>
      <div class="kb-form-row">
        <div class="form-group">
          <label>주기</label>
          <select id="new-period" class="kb-input">
            <option value="DAILY">매일</option>
            <option value="WEEKLY" selected>매주</option>
            <option value="MONTHLY">매월</option>
            <option value="QUARTERLY">분기</option>
          </select>
        </div>
        <div class="form-group">
          <label>목표 횟수</label>
          <input type="number" id="new-target" class="kb-input" min="1" value="1">
        </div>
      </div>
      <div class="kb-modal-actions">
        <button type="button" class="btn btn-secondary" id="add-cancel-btn">취소</button>
        <button type="button" class="btn btn-primary" id="add-submit-btn">추가</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="/js/kanban.js"></script>
</body>
</html>
