spring.application.name=yearly-goal-tracker

# 운영 프로필(prod) - 비밀값은 전부 환경변수로 주입한다 (.env.example 참고)
server.port=${PORT:8080}
# 리버스 프록시(HTTPS 종단) 뒤에서 https 기준으로 OAuth 리디렉션 URL을 만들도록 함
server.forward-headers-strategy=framework

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:yearly_goal_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# 신규 가입 허용 이메일 (쉼표 구분). 비워두면 누구나 가입 가능하므로 운영에서는 반드시 채운다.
# 이미 가입된 계정의 로그인에는 영향이 없다. 이메일 가입과 Google 로그인(신규 계정 생성) 모두에 적용된다.
app.signup.allowed-emails=${ALLOWED_EMAILS:}

# Google Gemini (비워두면 AI 추천 기능만 오류 응답)
google.ai.api-key=${GOOGLE_AI_API_KEY:}

# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# 예: https://goals.example.com  (끝에 / 없이)
app.oauth2.redirect-uri=${APP_BASE_URL}/oauth2-redirect.html
