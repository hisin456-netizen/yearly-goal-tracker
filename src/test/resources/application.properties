spring.application.name=yearly-goal-tracker-test

# Test H2 Database Configuration (PostgreSQL Mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Configuration for testing
jwt.secret=YearlyGoalTracker2026SuperSecretKeyForJwtTokenGenerationAndValidation256bit
jwt.expiration=86400000

# OAuth2 / AI (컨텍스트 로딩용 테스트 더미 값)
app.oauth2.redirect-uri=http://localhost:8080/oauth2-redirect.html
google.ai.api-key=test-api-key
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
