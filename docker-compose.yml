services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yearly_goal_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-yearly_goal_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL is required}
      # 가입 허용 이메일(쉼표 구분). 깜빡하고 가입이 열린 채 배포되지 않도록 필수값으로 둔다.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required (e.g. me@gmail.com,partner@gmail.com)}
    # 앱은 호스트 로컬에만 열고, 외부 공개는 아래 caddy(https 프로필)를 통해서만 한다.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    mem_limit: 1g
    volumes:
      - uploads:/app/uploads

  # 서버 배포용 HTTPS 프록시:  docker compose --profile https up -d --build
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
